  description: >-
    The Tigera client library — generated Go clientset, listers and informers for the Calico
    Enterprise / Calico Cloud API. Get, list, watch, create, update and delete Calico custom
    resources the same way client-go does for native Kubernetes resources.
  docs: https://docs.tigera.io/calico-cloud/reference/api
