description: >-
  Tigera's client-library story is Go-only, which follows from the API being a Kubernetes
  aggregated API server — the generated clientset, informers and listers are the idiomatic
  client, and every other language reaches the API through the standard Kubernetes client for
  that language rather than a Tigera-published SDK. npm `calico` and PyPI `calico` exist but are
  unrelated third-party packages (a file-uppercasing utility and a CLI I/O checker
  respectively) and are recorded here explicitly so a future run does not mistake them for
  first-party SDKs.
