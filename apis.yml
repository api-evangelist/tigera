apis:
- aid: tigera:goldmane-flows-api
  name: Goldmane Flows API
  description: >-
    Goldmane is the Calico flow aggregation and network-observability service introduced in Calico Open
    Source 3.30. It exposes a gRPC API for querying aggregated flow data — List for point-in-time queries,
    Stream for a long-running stream of new flows, FilterHints for progressive discovery of filter criteria
    such as namespaces and source/destination names — plus statistics and flow-ingestion services. Tigera
    publishes the proto3 definition in the projectcalico/calico repository and documents it on the company
    blog.
  humanURL: >-
    https://www.tigera.io/blog/calico-open-source-3-30-exploring-the-goldmane-api-for-custom-kubernetes-network-observability/
  baseURL: https://goldmane.calico-system.svc:7443
  tags:
  - Observability
  - gRPC
  - Networking
  properties:
  - type: Protobuf
    url: grpc/tigera-goldmane-api.proto
  - type: SourceCode
    url: https://github.com/projectcalico/calico/tree/master/goldmane
  x-evidence:
    proto_url: https://raw.githubusercontent.com/projectcalico/calico/master/goldmane/proto/api.proto
    http_status: 200
    fetched: '2026-08-05'
    base_url_note: >-
      Goldmane runs in-cluster in the calico-system namespace; the address above is the in-cluster service
      address for the component, not a vendor-hosted endpoint.
- aid: tigera:tigera-mcp-server
  name: Tigera MCP Server
  description: >-
    A remote Model Context Protocol server published on the tigera.io host, advertised through RFC 8414
    OAuth authorization-server metadata and RFC 9728 protected-resource metadata. The server fronts the
    Tigera WordPress content estate (the marketing site, blog and resources), not the Calico cluster API.
    Authorization is OAuth 2.1 authorization-code with PKCE (S256), a single `mcp` scope, public clients
    (token_endpoint_auth_method none) and client-ID metadata documents. tools/list is authenticated —
    an anonymous JSON-RPC call returns 401 mcp_unauthorized — so the live tool schemas require an authorized
    session.
  humanURL: https://www.tigera.io/
  baseURL: https://www.tigera.io/wp-json/mcp/mcp-oauth-server
  tags:
  - MCP
  - Agents
  - Content
  properties:
  - type: MCPServer
    url: mcp/tigera-mcp.yml
  - type: ToolCrosswalk
    url: mcp/tigera-tool-crosswalk.yml
