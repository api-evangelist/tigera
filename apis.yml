aid: tigera
name: Tigera
description: >-
  Tigera is the creator of Project Calico, the open-source networking and network-security
  engine for Kubernetes, and the company behind Calico Open Source, Calico Enterprise and
  Calico Cloud. Its products deliver container networking (BGP, eBPF, VPP and standard Linux
  data planes), tiered network policy and microsegmentation, egress gateways and egress access
  control, cluster mesh, an Envoy-based ingress gateway, workload-based IDS/IPS/WAF and threat
  detection, and full-stack observability (Service Graph, flow/DNS/L7 logs, packet capture) for
  Kubernetes clusters. The programmable surface is Kubernetes-native: the projectcalico.org/v3
  aggregated API server exposes 27 custom resources through a published Swagger 2.0 definition,
  the Goldmane gRPC service exposes aggregated flow observability, calicoctl and kubectl are the
  first-party CLIs, and Calico Cloud adds a SaaS management plane with a read-only Usage API and
  security-event webhooks.
