description: >-
  Cross-cutting standards conformance for Tigera's API surface. Two things stand out. First,
  Calico's contract conforms deeply to the Kubernetes API conventions and Swagger 2.0 rather
  than to any REST-over-HTTP convention family — no OpenAPI 3.x, no RFC 9457, no RFC 8594.
  Second, the MCP server on www.tigera.io is a textbook implementation of the modern MCP
  authorization stack: RFC 8414 authorization-server metadata, RFC 9728 protected-resource
  metadata, and PKCE, all published anonymously.
