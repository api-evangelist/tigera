description: >-
  Tigera runs three release trains with different lifecycle mechanics: Calico Open Source
  (semver minor line, currently 3.32, documented per-version with a docs version switcher),
  Calico Enterprise (its own 3.x line with versioned docs back to 3.20), and Calico Cloud (a
  continuously deployed SaaS on a 22.x/23.x calendar-ish major line). The gap worth naming is
  that Tigera publishes no formal deprecation or end-of-life policy — deprecations are announced
  in release notes and marked in the docs, and the support policy covers response times only.
versioning:
  scheme: api-group-version-in-path (API) + semver (products)
  api_current: projectcalico.org/v3
  api_mechanism: >-
    The Calico API is versioned as a Kubernetes API group. v3 is the only served version; the
    spec still carries a handful of legacy libcalico-go v1 definitions (e.g. IPIPConfiguration).
    Discovery endpoints (getAPIVersions, getProjectcalicoOrgAPIGroup,
    getProjectcalicoOrgV3APIResources) let a client negotiate at runtime.
  products:
  - name: Calico Open Source
    current: '3.32'
    docs: https://docs.tigera.io/calico/latest/release-notes/
    versioned_docs: 3.29, 3.30, 3.31, 3.32
  - name: Calico Enterprise
    docs: https://docs.tigera.io/calico-enterprise/latest/release-notes/
    versioned_docs: 3.20-2, 3.21-2, 3.22-2, 3.23-2, 3.24-1
  - name: Calico Cloud
    current: 23.0.0
    released: '2026-07-28'
    docs: https://docs.tigera.io/calico-cloud/release-notes/
    versioned_docs: 22-2, 23-2
