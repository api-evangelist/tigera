description: >-
  Crosswalk between Tigera's agent-facing MCP surface and its machine-readable REST surface. The
  headline finding is a full divergence: the two surfaces do not overlap at all. The MCP server
  lives on the WordPress marketing host (www.tigera.io/wp-json/mcp/mcp-oauth-server) and fronts
  site content; the published Swagger 2.0 contract describes the Calico aggregated Kubernetes
  API server that runs inside a customer's own cluster. No MCP tool is backed by a Calico
  operation, and no Calico operation is exposed as an MCP tool. Recording that divergence is the
  point of this artifact — an agent that authenticates to the Tigera MCP server gains no ability
  to read or write network policy.
